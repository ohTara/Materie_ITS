name: Build Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd echoes_of_the_crypt
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows executable
        run: |
          cd echoes_of_the_crypt
          python -m PyInstaller --noconfirm --clean EchoesOfTheCrypt.spec

      - name: Create zip archive
        run: |
          cd echoes_of_the_crypt
          Compress-Archive -Path dist\EchoesOfTheCrypt -DestinationPath EchoesOfTheCrypt-windows.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoesOfTheCrypt-windows
          path: echoes_of_the_crypt/EchoesOfTheCrypt-windows.zip
          retention-days: 30

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: echoes_of_the_crypt/EchoesOfTheCrypt-windows.zip
          generate_release_notes: true